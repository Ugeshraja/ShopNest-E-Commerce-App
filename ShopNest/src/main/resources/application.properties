# ===================================================================
# Server Configuration (Render assigns $PORT, fallback 8080)
# ===================================================================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===================================================================
# Database Configuration
# Handled dynamically by DataSourceConfig:
# Supports DATABASE_URL (Render/Supabase/Neon postgres:// format)
# as well as standard JDBC properties and local fallbacks
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:#{null}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:#{null}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:#{null}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Thymeleaf
# ===================================================================
spring.thymeleaf.cache=false

# ===================================================================
# Logging
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.com.shopnest=INFO